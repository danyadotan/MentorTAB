<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MentorTAB · Desk</title>
<style>
  :root{--navy-900:#0c1c42;--card:#17316b;--line:#2c4585;--line-soft:#23386e;
    --cream:#f2ede0;--amber:#f5b52e;--green:#46b98a;--ink:#eaf0fb;--ink-2:#b7c6e6;--ink-3:#8598c4;
    --chip:#21407f;--chip-hover:#2a4e93;--bubble-you:#1e4634;--bubble-bot:#17316b;
    --font:"Assistant","Heebo","Segoe UI",system-ui,-apple-system,Arial,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:
    radial-gradient(1000px 560px at 85% -10%,rgba(245,181,46,.10),transparent 60%),
    radial-gradient(800px 600px at 0% 100%,rgba(70,185,138,.07),transparent 55%),var(--navy-900);
    color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:22px 16px;display:flex;flex-direction:column;height:100vh}
  .en{direction:ltr;unicode-bidi:isolate}
  header{display:flex;align-items:center;gap:11px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.1rem;color:var(--cream)}
  .brand span{color:var(--amber)}.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber)}
  .tag{font-size:.72rem;font-weight:700;color:var(--green);border:1px solid rgba(70,185,138,.4);border-radius:999px;padding:3px 10px}
  .sub{color:var(--ink-3);font-size:.85rem;margin:-6px 0 14px}
  .chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:6px 2px 10px}
  .m{max-width:88%;padding:9px 13px;border-radius:13px;font-size:.93rem;white-space:pre-wrap;line-height:1.5;animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}}
  @media(prefers-reduced-motion:reduce){.m{animation:none}}
  .m.you{background:var(--bubble-you);align-self:flex-end;border-end-end-radius:3px;color:#dff3e8}
  .m.bot{background:var(--bubble-bot);border:1px solid var(--line-soft);align-self:flex-start;border-end-start-radius:3px}
  .m.bot .who{font-size:.72rem;font-weight:800;color:var(--amber);margin-bottom:3px}
  .ext{display:inline-block;margin-top:7px;font-size:.72rem;color:#eb9aa2;background:rgba(224,86,79,.12);border:1px solid rgba(224,86,79,.35);border-radius:7px;padding:3px 9px}
  .thinking i{width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block;animation:blink 1.1s infinite;margin-inline-end:3px}
  .thinking i:nth-child(2){animation-delay:.18s}.thinking i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,65%,100%{opacity:.25}32%{opacity:1}}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 10px}
  .chip{font:inherit;font-size:.82rem;background:var(--chip);color:var(--ink);border:1px solid var(--line-soft);border-radius:999px;padding:7px 13px;cursor:pointer}
  .chip:hover{background:var(--chip-hover)}
  form{display:flex;gap:8px;padding-top:4px;border-top:1px solid var(--line-soft)}
  input{flex:1;background:var(--card);border:1px solid var(--line-soft);border-radius:999px;color:var(--ink);font:inherit;padding:11px 16px}
  input:focus{outline:2px solid var(--amber);outline-offset:1px}
  button.send{background:var(--cream);color:#102653;border:none;border-radius:999px;padding:11px 20px;font:inherit;font-weight:800;cursor:pointer}
  button.send:disabled{opacity:.5;cursor:default}
  .foot{color:var(--ink-3);font-size:.74rem;text-align:center;padding-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>Mentor<span>TAB</span> · Desk</div>
    <span class="tag" id="classTag">הרשמות &amp; הורים</span>
  </header>
  <p class="sub" id="sub">עוזר ההורים של החוג — שאלות הרשמה, מסלולים, עלויות, לוח זמנים והסעות. זוכר את הקבוצה, ומסמן מתי מידע מגיע מבחוץ.</p>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="f"><input id="q" placeholder="שאלו אותי על ההרשמה לחוג..." autocomplete="off"><button class="send" id="send" type="submit">שלח</button></form>
  <p class="foot en">MentorTAB · Desk — © Bridge-iT Technologies · by Danya Dotan</p>
</div>
<script>
const CLASS=new URLSearchParams(location.search).get('class')||null;
const FALLBACK_CHIPS=["מאיזה גיל אפשר להצטרף?","כמה זה עולה?","מה לוח הזמנים?"];
const chat=document.getElementById('chat'),chips=document.getElementById('chips'),form=document.getElementById('f'),input=document.getElementById('q'),send=document.getElementById('send');
const sid='desk-'+Math.random().toString(36).slice(2,10);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
function you(t){const m=el('div','m you');m.textContent=t;chat.appendChild(m);chat.scrollTop=chat.scrollHeight;}
function bot(t){const m=el('div','m bot');m.innerHTML='<div class="who">MentorTAB · Desk</div>';const p=el('div');p.textContent=t;m.appendChild(p);chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return m;}
function thinking(){const m=el('div','m bot');m.innerHTML='<div class="who">MentorTAB · Desk</div><span class="thinking"><i></i><i></i><i></i></span>';chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return m;}
function renderChips(list){chips.innerHTML='';list.forEach(c=>{const b=el('button','chip');b.textContent=c;b.type='button';b.onclick=()=>ask(c);chips.appendChild(b);});}
async function loadClass(){
  let title='',qs=FALLBACK_CHIPS;
  try{
    const r=await fetch('/profile-info'+(CLASS?('?class='+encodeURIComponent(CLASS)):''));
    if(r.ok){const d=await r.json();title=d.display_name||'';if(d.suggested_questions&&d.suggested_questions.length)qs=d.suggested_questions;}
  }catch(e){}
  if(title){document.getElementById('classTag').textContent='הורים · '+title;document.title='MentorTAB · Desk — '+title;
    document.getElementById('sub').textContent='עוזר ההורים של חוג '+title+' — הרשמה, קבוצות, לוח זמנים, הופעות והסעות. זוכר את הקבוצה, ומסמן מתי מידע מגיע מבחוץ.';}
  renderChips(qs);
  bot('היי! אני עוזר ההורים'+(title?' של חוג '+title:'')+' 🤖 אפשר לשאול אותי כל שאלה — או ללחוץ על אחת השאלות הנפוצות למטה.');
}
loadClass();
async function ask(text){
  if(!text)return;send.disabled=true;you(text);const w=thinking();
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:sid,profile:CLASS})});
    const d=await r.json();w.remove();
    if(!r.ok)throw new Error(d.detail||('שגיאה '+r.status));
    bot(d.reply);
  }catch(err){w.remove();const m=bot('לא הצלחתי להביא תשובה: '+err.message);}
  send.disabled=false;input.focus();
}
form.addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(!t)return;input.value='';ask(t);});
</script>
</body>
</html>
